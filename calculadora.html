<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

<style>
 h1 {  
   color: rgb(255, 255, 255);
    margin: auto;
    text-align: center;
    font-family: Arial;  
    width: 200px;
    background-color: rgb(32, 32, 32);
    border-radius: 5px; 
    margin-top:40px;
}
 
table {
    position: relative;
    left: -16px;
}

.p {
    background-color: aliceblue;
}

.Calculadora {
    background-color: rgb(0, 0, 0);
    width:200px;
    height: 320px;
    border-radius: 20px;
    padding: 50px;
    margin: 0 auto;    
    font-family: Arial;
    margin-top: 55px;      
}

.botao {
    text-align: center;
    background-color: rgb(112, 114, 116);
    width: 50px;
    height: 50px;
    cursor: pointer;
    margin: 3px;
}  

.botaoo {
   background-color: rgb(255, 200, 0);
   width: 50px;
   height: 50px;
   cursor: pointer;
   margin: 3px;
} 

.bb{
   background-color: rgb(110, 121, 121);
   width: 50px;
   height: 50px;
   cursor: pointer;
   margin: 3px;
}

.botao:active{
   background-color: rgb(156, 165, 165);
}

.botaoo:active{
   background-color: rgb(250, 254, 253);
}

.bb:active{
   background-color: rgb(156, 165, 165);
}

#resultado{
    width: 207px;
    background-color: aliceblue;
    margin: 5px;
    text-align: right;
    height: 30px;
    position: relative;
    top: -15px;
    position: relative;
    left: -5px;
    line-height: 30px;
    padding-right: 4px;
    box-sizing: border-box; 
}


</style>
</head>
<body>
    <h1>Calculadora</h1>
    <div class="Calculadora">
    <div class="botoes">
        <p id="resultado"></p>
        <table>
            <tr>
                <td><button class="botao"onclick="clean('AC')">AC</button></td>
                <td><button class="botao"onclick="back('<')"><</button></td>
                <td><button class="botao"onclick="insert('%')">%</button></td>
                <td><button class="botaoo"onclick="insert('/')">/</button></td>
            </tr>
             <tr>
                <td><button class="bb"onclick="insert('7')">7</button></td>
                <td><button class="bb"onclick="insert('8')">8</button></td>
                <td><button class="bb"onclick="insert('9')">9</button></td>
                <td><button class="botaoo"onclick="insert('*')">X</button></td>
            </tr>
             <tr>
                <td><button class="bb"onclick="insert('4')">4</button></td>
                <td><button class="bb"onclick="insert('5')">5</button></td>
                <td><button class="bb"onclick="insert('6')">6</button></td>
                <td><button class="botaoo"onclick="insert('-')">-</button></td>
            </tr>
             <tr>
                <td><button class="bb"onclick="insert('1')">1</button></td>
                <td><button class="bb"onclick="insert('2')">2</button></td>
                <td><button class="bb"onclick="insert('3')">3</button></td>
                <td><button class="botaoo"onclick="insert('+')">+</button></td>
            </tr>
             <tr>
                <td colspan="2"><button class="bb" onclick="insert('0')" style="width: 106px;">0</button></td>
                <td><button class="bb"onclick="insert('.')">.</button></td>
                <td><button class="botaoo"onclick="calcular()">=</button></td>
            
            </tr>
        </table>
    </div>
    </div>
    
</body>
</html>

<script>
    function insert(num)
    {
     var numero= document.getElementById("resultado").innerHTML;
     document.getElementById("resultado").innerHTML = numero + num;
   }
   function clean()
    {  
        document.getElementById("resultado").innerHTML = "";
     }
    function back()
    {
     var resultado= document.getElementById("resultado").innerHTML;
     document.getElementById("resultado").innerHTML = resultado.substring(0,resultado.length -1);
   }
    function calcular(resultado)
    {  
        var resultado= document.getElementById("resultado").innerHTML;
        if(resultado)
        { 
        document.getElementById("resultado").innerHTML = eval(resultado)
         }
     }
</script>
